[/Script/EngineSettings.GameMapsSettings]
; Replace these with your own maps. /Engine/Maps/Entry is an empty map that ships with the engine, so the
; networking loop can be playtested before any content exists.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/ProjectBytes.BytesFrontendGameMode
GlobalDefaultServerGameMode=/Script/ProjectBytes.BytesDistrictGameMode
; Short names usable in URLs: MapName?game=District
+GameModeClassAliases=(Name="Frontend",GameMode="/Script/ProjectBytes.BytesFrontendGameMode")
+GameModeClassAliases=(Name="District",GameMode="/Script/ProjectBytes.BytesDistrictGameMode")

[/Script/OnlineSubsystemUtils.IpNetDriver]
; Give slow editor-launched servers/clients a bit more room while loading.
InitialConnectTimeout=60.0
ConnectionTimeout=60.0

